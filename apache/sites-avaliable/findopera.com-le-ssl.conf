<IfModule mod_ssl.c>
<VirtualHost *:443>
    Protocols h2 http/1.1

    ServerAdmin jordan@jordaneldredge.com
    ServerName findopera.com
    ErrorLog ${APACHE_LOG_DIR}/findopera.com-error.log
    CustomLog ${APACHE_LOG_DIR}/access.log vhost_combined

    ProxyPreserveHost On

    # `ProxyTimeout 30` used to live here, and now lives in
    # conf-available/proxy-timeout.conf, which applies it to every vhost on
    # the box. It was added here on 17 September for the HTTP/2 POSTs that
    # reached Next and were never answered -- 49 in one day, each holding an
    # Apache worker for the full 300s before a 502 -- and for the MCP response
    # streams that answer in 150ms and then sit open on the client's own
    # timer. It fixed both, and fixed them for this vhost only; the same hangs
    # went on arriving for webamp and jordaneldredge.com, which had never been
    # given one. The reasoning and the measurements are in that file.
    #
    # Nothing site-specific is wanted here now. If that changes, a
    # `ProxyTimeout` in this block overrides the default for this vhost alone,
    # the way capt.dev does for uploads.

    ProxyPass / http://localhost:3333/

SSLCertificateFile /etc/letsencrypt/live/findopera.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/findopera.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
