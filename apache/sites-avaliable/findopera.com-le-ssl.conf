<IfModule mod_ssl.c>
<VirtualHost *:443>
    Protocols h2 http/1.1

    ServerAdmin jordan@jordaneldredge.com
    ServerName findopera.com
    ErrorLog ${APACHE_LOG_DIR}/findopera.com-error.log
    CustomLog ${APACHE_LOG_DIR}/access.log vhost_combined

    ProxyPreserveHost On

    # How long to wait on the app before giving up, in seconds.
    #
    # Unset, this inherits the global `Timeout 300`, which is five minutes for
    # an app whose p95 is 43ms. Two things were using that as a place to sit.
    #
    # HTTP/2 POSTs to `/` and `/api` that reach Next and are never answered:
    # 49 on 17 September, each holding an Apache worker for the full 300s
    # before a 502. The proxy hop is where they stall -- HTTP/1.1 POSTs of
    # every shape answer in 1-33ms -- so this bounds the damage without
    # touching the cause.
    #
    # And MCP response streams. Those answer in about 150ms and then sit open
    # on the client's own timer: 285s from Claude-User, 30.008s from
    # claude-code. Cutting them is not a loss and is not undefined behaviour:
    # closing a response stream is the cancellation signal on Streamable HTTP,
    # and by then the client has its whole answer.
    #
    # 30 rather than lower because the slowest legitimate thing measured on
    # this site is an OG image at 3.4s, which leaves roughly ten times the
    # headroom. Anything here that ever genuinely needs longer wants its own
    # `ProxyPass` with a `timeout=` of its own, not a bigger number for
    # everything.
    ProxyTimeout 30

    ProxyPass / http://localhost:3333/

SSLCertificateFile /etc/letsencrypt/live/findopera.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/findopera.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
