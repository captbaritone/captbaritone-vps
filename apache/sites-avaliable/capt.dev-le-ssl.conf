<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin jordan@jordaneldredge.com
    ServerName capt.dev
    # WSGIScriptAlias / /var/www/capt.dev/app.wsgi
    DocumentRoot /dev/null
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log vhost_combined

    # Serve /open-ani-online/ from filesystem
    Alias /open-ani-online/ /var/www/capt.dev/public_html/open-ani-online/
    <Directory /var/www/capt.dev/public_html/open-ani-online/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Prevent ProxyPass from overriding Alias
    ProxyPass /open-ani-online/ !
    ProxyPreserveHost On

    # Longer than the 30s default in conf-available/proxy-timeout.conf,
    # because this one takes file uploads.
    #
    # `ProxyTimeout` is an inactivity timeout on the proxy connection, and it
    # covers streaming the request body to the backend as well as waiting for
    # the response. A large file arriving over a slow link is the one shape of
    # request on this box where a thirty-second gap is a real upload rather
    # than a stall.
    #
    # Not visible in the logs, which is why this is caution rather than
    # measurement: capt.dev's slowest successful request across two days is
    # 0.31s and no slow POST appears at all, so either nobody uploaded
    # anything large in that window or uploads are faster than the worry
    # suggests. Cheap insurance either way -- this is a personal service
    # handling a few hundred requests a day, so holding a worker for two
    # minutes costs nothing, and the worker exhaustion this whole setting
    # guards against is a findopera.com problem.
    ProxyTimeout 120

    ProxyPass / http://localhost:8888/
    # ProxyPassReverse /node http://example.com:3000/node

    # No directory block needed for proxy-only vhost
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/capt.dev/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/capt.dev/privkey.pem
</VirtualHost>
</IfModule>
