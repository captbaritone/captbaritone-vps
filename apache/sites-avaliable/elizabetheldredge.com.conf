<VirtualHost *:80>
    ServerName elizabetheldredge.com
    ServerAlias www.elizabetheldredge.com

    DocumentRoot /home/captbaritone/projects/elizabetheldredge.com/public_html

    ErrorLog ${APACHE_LOG_DIR}/elizabetheldredge-error.log
    CustomLog ${APACHE_LOG_DIR}/elizabetheldredge-access.log vhost_combined

    <Directory /home/captbaritone/projects/elizabetheldredge.com/public_html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
RewriteEngine on
RewriteCond %{SERVER_NAME} =www.elizabetheldredge.com [OR]
RewriteCond %{SERVER_NAME} =elizabetheldredge.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
