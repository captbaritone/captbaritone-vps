# Request duration and MCP method in the shared access log.
#
# apache2.conf defines vhost_combined and then includes conf-enabled/ a few
# lines later, so redefining the nickname here wins for every vhost without
# patching a file the distribution owns and upgrades.
#
# %D is microseconds. Without it the logs can say what was requested and how
# often, but never what was slow -- which is the question you actually have
# when the box is struggling.
#
# Mcp-Method is what findopera.com's connector is doing. The method is in the
# JSON-RPC body, which is not logged and should not be, but the 2026-07-28
# spec requires the same value as a header, so one field turns "something at
# /mcp/beta was slow" into "tools/call was slow".
#
# It is here because a day of guessing did not settle what those slow requests
# are. What is measured: they answer 200 with the whole body delivered, and
# they last 285.0s from Claude-User and 30.008s from claude-code -- per-client
# constants, so a timer rather than work. What is not: which call they are.
# A direct tools/call against the same endpoint returns and closes the stream
# in 150ms, and subscriptions/listen -- the one method the spec designs to
# stay open -- is not implemented here and answers -32601.
#
# An earlier version of this comment blamed the `_meta` envelope: that a
# request without it is classified as legacy and answered as an event stream
# while a modern one gets JSON. That was tested against the deployed build and
# is not what happens. Both eras are answered `text/event-stream`, and both
# close promptly. The envelope is not the variable, which is exactly why this
# field is worth logging instead of theorising about.
#
# Mcp-Name is which tool the method was for, and it is here because reading
# the method alone got the story wrong twice in one evening. A line saying
# `tools/call 401` looks like the connector being refused a write; the same
# line is also a probe from a test script, and without the tool name the only
# thing separating them is a user agent two fields to the left. Both readings
# were reported as fact before the agent was checked. The header is required
# on tools/call, resources/read and prompts/get, and is `-` everywhere else,
# so the cost of settling that is one field on the requests that have one.
#
# Its value can be a resource URI, and the spec allows a `=?base64?...?=`
# sentinel when a name will not sit in a header, so it is quoted for the same
# reason everything else here is.
#
# All three are appended rather than inserted, so anything reading these logs
# positionally from the left keeps working. Note that this leaves %D third
# from the end: a script reading the *last* field for duration is now two
# fields out, having been one field out since Mcp-Method arrived. Quoted
# because a header value is whatever a client sent, and an unquoted one
# containing a space would silently shift every field after it. Apache writes
# `-` when the header is absent, which is every request to every other site on
# this box.
LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D \"%{Mcp-Method}i\" \"%{Mcp-Name}i\"" vhost_combined
