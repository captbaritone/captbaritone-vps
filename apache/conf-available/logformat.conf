# Request duration in the shared access log.
#
# apache2.conf defines vhost_combined and then includes conf-enabled/ a few
# lines later, so redefining the nickname here wins for every vhost without
# patching a file the distribution owns and upgrades.
#
# %D is microseconds, appended rather than inserted, so anything already
# reading these logs positionally from the left keeps working. Without it the
# logs can say what was requested and how often, but never what was slow --
# which is the question you actually have when the box is struggling.
LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" vhost_combined
