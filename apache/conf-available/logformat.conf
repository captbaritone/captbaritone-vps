# Request duration and MCP method in the shared access log.
#
# apache2.conf defines vhost_combined and then includes conf-enabled/ a few
# lines later, so redefining the nickname here wins for every vhost without
# patching a file the distribution owns and upgrades.
#
# %D is microseconds. Without it the logs can say what was requested and how
# often, but never what was slow -- which is the question you actually have
# when the box is struggling.
#
# Mcp-Method is what findopera.com's connector is doing. The method is in the
# JSON-RPC body, which is not logged and should not be, but the 2026-07-28
# spec requires the same value as a header, so one field turns "something at
# /mcp/beta was slow" into "tools/call was slow". It was added to answer a
# specific question: 12.5% of requests there hang for an exact multiple of
# fifteen seconds, because a request without the modern `_meta` envelope is
# answered as an event stream and the connection then idles until the client
# times out. Knowing which methods arrive that way is the difference between
# fixing it and guessing at it.
#
# Both are appended rather than inserted, so anything reading these logs
# positionally from the left keeps working. Note that this does move %D off
# the end, so a script reading the *last* field for duration wants the
# second-to-last now. Quoted because a header value is whatever a client sent,
# and an unquoted one containing a space would silently shift every field
# after it. Apache writes `-` when the header is absent, which is every
# request to every other site on this box.
LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D \"%{Mcp-Method}i\"" vhost_combined
