# How long to wait on a proxied app before giving up, for every site on the box.
#
# Unset, a vhost inherits the global `Timeout 300` from apache2.conf. That is
# five minutes, and `mod_proxy_http` ties an Apache worker to a proxied
# connection for its whole life, so anything that stalls holds a worker for
# five minutes. There are 150 of them.
#
# findopera.com hit this first and got its own `ProxyTimeout 30` on 17
# September: 49 HTTP/2 POSTs in one day reaching Next and never being
# answered, each holding a worker for the full 300s before a 502. That fixed
# findopera and only findopera, because a `ProxyTimeout` inside a
# `<VirtualHost>` applies to that vhost alone. The next day the same
# `AH01102: error reading status line from remote server` was still arriving
# for `localhost:3001`, `:3002` and `:4000` -- webamp and jordaneldredge.com,
# which had never been given one.
#
# So it belongs here instead. Server config context covers every vhost,
# including ones added later, which is the case a per-vhost directive gets
# wrong by omission rather than by being incorrect.
#
# 30 seconds, from measurement rather than taste. Response times across two
# days of logs, successful requests only, `%D` from the shared log format:
#
#     vhost                     n        p50      p95      p99      max
#     api.webamp.org          227      0.01s    0.05s    0.07s    0.14s
#     capt.dev                338      0.00s    0.06s    0.17s    0.31s
#     elizabetheldredge.com   323      0.00s    0.00s    0.00s    0.12s
#     fachme.com              984      0.00s    0.00s    0.00s    5.01s
#     findopera.com         24142      0.01s    0.16s    0.42s  286.92s
#     jordaneldredge.com    10333      0.01s    0.32s    0.69s  300.11s
#     markdown.today          297      0.00s    0.00s    0.00s    0.87s
#     urlme.me               1280      0.01s    0.24s    0.51s    5.00s
#
# The worst p99 anywhere is 0.69s, so 30 is about forty times the slowest
# thing any of these sites legitimately does. The two maxima that are not
# hangs -- 5.01s and 5.00s, suspiciously round -- still have six times the
# headroom. The two that are hangs, 286.92s and 300.11s, are the thing this
# exists to cut.
#
# Safe to apply globally because nothing here is meant to stay open. No vhost
# proxies websockets, and `mod_proxy_wstunnel` is not even loaded -- only
# `proxy_http`. The one long-lived thing on the box is findopera's MCP
# response streams, which answer in about 150ms and then sit open on the
# client's own timer; closing one is the cancellation signal on Streamable
# HTTP rather than an error, and by then the client has its whole answer.
#
# A site that genuinely needs longer should say so in its own vhost, the way
# capt.dev does for uploads. A bigger number here would buy that one site its
# headroom at the cost of every other site's workers.
ProxyTimeout 30
