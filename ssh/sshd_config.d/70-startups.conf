# How many unauthenticated connections sshd will hold at once.
#
# The default is 10:30:100 -- from ten in progress, start refusing 30% of new
# ones, and refuse everything at a hundred. That is sized for a host nobody is
# scanning. This one takes about 84,000 connection attempts every four days
# from around 1,300 addresses, so ten in flight is normal traffic, and sshd has
# dropped over a thousand connections for being over the line.
#
# The ones that matter are the deploys. GitHub Actions makes a handful of ssh
# connections per run, and being refused at connect time is not something the
# workflow can wait out the way it waits out a slow migration: it fails, often
# after the build has already shipped, leaving new code beside an old process
# until somebody re-runs it. That happened three times in one day.
#
# 100:30:200 costs almost nothing on a box that is otherwise idle -- these are
# connections that have not authenticated yet, and each is cheap.
MaxStartups 100:30:200

# And a cap per source, which is the part that actually targets the abuse.
#
# Raising the global limit alone means one scanner can still fill it. This says
# no single address may hold more than five unauthenticated connections at
# once, so the budget above cannot be consumed by whoever is loudest. A deploy
# opens one connection at a time and never comes near it.
PerSourceMaxStartups 5
